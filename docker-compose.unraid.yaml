# Unraid-Sample für ghcr.io/gompman/kasse
#
# Unraid-User nobody:users = PUID 99 / PGID 100.
# Nicht extra `user:` setzen — der Entrypoint muss als root
# /data chownen und danach auf 99:100 wechseln.
#
# Pangolin: Auth bleibt außen. Target http://kasse:3000
# im selben Docker-Netz. Port 3000 nicht ins Internet.

services:
  kasse:
    image: ghcr.io/gompman/kasse:latest
    container_name: kasse
    hostname: kasse
    restart: unless-stopped
    pull_policy: always
    environment:
      TZ: Europe/Berlin
      PORT: "3000"
      DATA_DIR: /data
      PUID: "99"
      PGID: "100"
      UMASK: "022"
    volumes:
      - /mnt/user/appdata/kasse:/data
    # LAN-Test. Für Pangolin diese ports-Zeilen auskommentieren
    # und unten das externe Netz aktivieren.
    ports:
      - "3000:3000"
    # networks:
    #   - proxynet
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.webui: "http://[IP]:[PORT:3000]"

