<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasse" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kasse</title>
    <link rel="stylesheet" href="/css/styles.css?v=layout5" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="btn btn-icon"
          id="menu-toggle"
          aria-label="Menü"
          aria-expanded="false"
          aria-controls="app-menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M4 12h16" />
            <path d="M4 17h16" />
          </svg>
        </button>
        <h1 id="pack-title">Kasse</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost" id="next-customer">Nächster Kunde</button>
      </div>
    </header>

    <div class="menu-backdrop is-hidden" id="menu-backdrop"></div>
    <nav class="app-menu is-hidden" id="app-menu" hidden>
      <button type="button" class="btn btn-ghost app-menu-item" id="fullscreen-toggle" aria-label="Vollbild">
        <svg class="icon-fs-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5" />
          <path d="M16 3h5v5" />
          <path d="M3 16v5h5" />
          <path d="M21 16v5h-5" />
        </svg>
        <svg class="icon-fs-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 3v6H3" />
          <path d="M15 3v6h6" />
          <path d="M3 15h6v6" />
          <path d="M21 15h-6v6" />
        </svg>
        <span id="fullscreen-label">Vollbild</span>
      </button>
      <button type="button" class="btn btn-ghost app-menu-item" id="edit-toggle">Pflegen</button>
      <label class="pack-select-wrap app-menu-item">
        <span>Produktpaket</span>
        <select id="pack-select"></select>
      </label>
    </nav>

    <div class="edit-toolbar is-hidden" id="edit-toolbar">
      <button type="button" class="btn btn-ghost" id="add-product">Artikel +</button>
      <button type="button" class="btn btn-ghost" id="new-pack">Neues Paket</button>
      <button type="button" class="btn btn-ghost" id="copy-pack">Duplizieren</button>
      <button type="button" class="btn btn-primary" id="save-pack">Speichern</button>
      <p class="edit-status" id="edit-status" hidden></p>
    </div>

    <main class="layout">
      <section class="panel products" aria-labelledby="products-heading">
        <h2 id="products-heading">Produkte</h2>
        <p class="empty-hint is-hidden" id="pack-empty">Kein Paket geladen.</p>
        <div class="product-grid" id="product-grid"></div>
      </section>

      <aside class="checkout">
        <section class="panel order-panel" aria-labelledby="order-heading">
          <h2 id="order-heading">Bestellung</h2>
          <p class="empty-hint" id="cart-empty">Noch keine Artikel</p>
          <ul class="cart-list" id="cart-list"></ul>
          <p class="cart-count is-hidden" id="cart-count"></p>
        </section>

        <section class="panel cash-panel" aria-labelledby="cash-heading">
          <h2 id="cash-heading">Bargeld</h2>
          <div class="cash-buttons" id="cash-buttons">
            <button type="button" class="btn btn-cash" data-cents="50">0,50 €</button>
            <button type="button" class="btn btn-cash" data-cents="100">1 €</button>
            <button type="button" class="btn btn-cash" data-cents="200">2 €</button>
            <button type="button" class="btn btn-cash" data-cents="500">5 €</button>
            <button type="button" class="btn btn-cash" data-cents="1000">10 €</button>
            <button type="button" class="btn btn-cash" data-cents="2000">20 €</button>
            <button type="button" class="btn btn-cash" data-cents="5000">50 €</button>
            <button type="button" class="btn btn-ghost" id="clear-given" aria-label="Gegeben löschen">
              Löschen
            </button>
          </div>
        </section>
      </aside>
    </main>

    <footer class="totals-bar" aria-live="polite">
      <div class="totals-item totals-sum">
        <span>Summe</span>
        <strong id="total-sum">0,00 €</strong>
      </div>
      <div class="totals-item">
        <span>Gegeben</span>
        <strong id="given-amount">0,00 €</strong>
      </div>
      <div class="totals-item totals-change">
        <span>Rückgeld</span>
        <strong id="change-amount">—</strong>
      </div>
    </footer>

    <dialog class="pack-dialog" id="pack-dialog">
      <form method="dialog" id="pack-form">
        <h2 id="pack-dialog-title">Neues Paket</h2>
        <label>
          Name
          <input type="text" id="pack-name-input" required maxlength="60" autocomplete="off" />
        </label>
        <div class="dialog-actions">
          <button type="submit" class="btn btn-ghost" value="cancel">Abbrechen</button>
          <button type="submit" class="btn btn-primary" id="pack-dialog-confirm" value="confirm">
            Anlegen
          </button>
        </div>
      </form>
    </dialog>

    <script src="/js/app.js?v=layout5"></script>
  </body>
</html>
